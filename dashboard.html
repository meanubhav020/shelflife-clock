<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf-Life Clock</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a64; --line: #e3e1d8;
    --ready: #1f7a4d; --ready-bg: #e3f3ea;
    --hold: #b4471a; --hold-bg: #fbe9df;
    --monitor: #4a5a78; --monitor-bg: #e6ebf3;
    --accent: #1d1d1b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #201f1c; --text: #ecebe4; --muted: #9a988e; --line: #34322d;
      --ready: #6fd0a0; --ready-bg: #1b3a2b;
      --hold: #f0996b; --hold-bg: #3e2418;
      --monitor: #9db2d6; --monitor-bg: #232c3d;
      --accent: #ecebe4;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .banner { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 12px; color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .n { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .l { color: var(--muted); font-size: 13px; }
  .top5 { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
  .top5 h2 { font-size: 15px; margin: 0 0 8px; }
  .top5 ol { margin: 0; padding-left: 20px; }
  .roi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
  .roi h2 { font-size: 15px; margin: 0 0 4px; }
  .roi .sub { font-size: 13px; margin: 0 0 12px; }
  .roi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .roi-grid .n { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .roi-grid .l { color: var(--muted); font-size: 13px; }
  .roi table { width: auto; min-width: 320px; font-size: 13px; }
  .roi table th, .roi table td { padding: 5px 14px 5px 0; border: 0; }
  .roi table th { text-transform: none; letter-spacing: 0; font-size: 12px; }
  .roi table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .roi table tr.base td { font-weight: 650; }
  .roi p.note { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .controls button { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; }
  .controls button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .controls input { margin-left: auto; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 10px; border-radius: 8px; font: inherit; min-width: 200px; }
  .tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; background: var(--panel); user-select: none; }
  th.sortable { cursor: pointer; white-space: nowrap; }
  th.sortable:hover { color: var(--text); }
  th .arrow { display: inline-block; width: 1em; opacity: .5; }
  th.sorted .arrow { opacity: 1; color: var(--accent); }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.READY { color: var(--ready); background: var(--ready-bg); }
  .pill.HOLD { color: var(--hold); background: var(--hold-bg); }
  .pill.MONITOR { color: var(--monitor); background: var(--monitor-bg); }
  .muted { color: var(--muted); }
  .reason { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .cl { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .star { color: var(--hold); font-weight: 700; }
  .live { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
  .live h2 { font-size: 15px; margin: 0 0 4px; }
  .live-row { display: flex; gap: 8px; margin: 10px 0 6px; }
  .live-row input { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 8px 10px; border-radius: 8px; font: inherit; min-width: 0; }
  .live-row button { border: 0; background: var(--accent); color: var(--bg); padding: 8px 18px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .live-row button:disabled { opacity: .45; cursor: not-allowed; }
  .live-item { border-top: 1px solid var(--line); padding: 10px 0 2px; margin-top: 10px; }
  .live-item pre { white-space: pre-wrap; font: 13px/1.45 ui-monospace, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0 0; }
  .live-err { color: var(--hold); }
  @media (max-width: 720px) { .cards { grid-template-columns: repeat(2, 1fr); } .controls input { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Shelf-Life Clock</h1>
  <p class="sub">Larkfield Distribution, expiry risk queue. Calculations as of 2026-09-21.</p>
  <div class="banner">Training prototype. All data and policy are made up. Read-only view of the API run (action_queue_api.csv). Nothing here sends or approves anything.</div>

  <div class="live" id="live" hidden>
    <h2>Run the agent live</h2>
    <p class="muted" id="live-note"></p>
    <div class="live-row">
      <input id="live-ids" placeholder="Batch IDs, e.g. LF-70006, LF-70003" autocomplete="off">
      <button id="live-run">Run</button>
    </div>
    <div id="live-msg" class="reason"></div>
    <div id="live-out"></div>
  </div>

  <div class="cards" id="cards"></div>
  <div class="roi" id="roi"></div>
  <div class="top5"><h2>Top five batches by score</h2><ol id="top5"></ol></div>

  <div class="controls" id="controls"></div>
  <div class="tablewrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

uded_test_batches": 10, "total_at_risk": 88741.19380399998, "total_recovered": 41514.16772160002, "r": 0.4678116885974187, "baseline": 185000, "acting_rates": [{"label": "cautious", "e": 0.4, "yearly_saving": 34618.06495620898}, {"label": "typical", "e": 0.6, "yearly_saving": 51927.09743431347}, {"label": "optimistic", "e": 0.8, "yearly_saving": 69236.12991241796}]}};
let filter = "ALL";
let query = "";
let sortKey = null, sortDir = 1;
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => v == null ? "n/a" : v.toLocaleString(undefined, {maximumFractionDigits: 2});
const money = v => v == null ? "n/a" : "$" + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

const COLUMNS = [
  {key: "batch_id", label: "Batch", type: "string"},
  {key: "description", label: "Item", type: "string"},
  {key: "days_to_expiry", label: "Days left", type: "number", num: true},
  {key: "batch_value", label: "Value", type: "number", num: true},
  {key: "score", label: "Score", type: "number", num: true},
  {key: "action", label: "Action", type: "string"},
  {key: "status", label: "Status", type: "string"},
  {key: "approvers", label: "Approver", type: "string", get: r => r.approvers.join("; ")},
];

function renderCards() {
  const s = DATA.summary;
  const items = [["In scope", s.in_scope], ["Ready", s.READY], ["Hold", s.HOLD], ["Monitor", s.MONITOR]];
  document.getElementById("cards").innerHTML = items.map(([l, n]) =>
    `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
}

function renderRoi() {
  const roi = DATA.roi;
  if (!roi || !roi.batches) { document.getElementById("roi").innerHTML = ""; return; }
  const rows = roi.acting_rates.map(a =>
    `<tr class="${a.label === "typical" ? "base" : ""}"><td>${esc(a.label[0].toUpperCase() + a.label.slice(1))} (E = ${Math.round(a.e * 100)}%)</td><td class="num">${money(a.yearly_saving)}</td></tr>`).join("");
  document.getElementById("roi").innerHTML = `
    <h2>Estimated ROI</h2>
    <p class="muted sub">Value at risk = batch value &times; unsold share. Recovery rates from REF-FIN-02. Estimate on made-up data, computed over ${roi.batches} in-scope batches (the ${roi.excluded_test_batches} designed test batches are excluded, same as the original sample).</p>
    <div class="roi-grid">
      <div><div class="n">${money(roi.total_at_risk)}</div><div class="l">total value at risk</div></div>
      <div><div class="n">${money(roi.total_recovered)}</div><div class="l">total value recovered</div></div>
      <div><div class="n">${(roi.r * 100).toFixed(2)}%</div><div class="l">R, recovery rate</div></div>
    </div>
    <table><tbody>
      <tr><th>Yearly saving = $${roi.baseline.toLocaleString()} &times; R &times; E</th><th class="num"></th></tr>
      ${rows}
    </tbody></table>
    <p class="note">E is the share of recommendations people act on in time before a batch expires; it is assumed, not measured.</p>`;
}

function renderTop5() {
  const byId = Object.fromEntries(DATA.rows.map(r => [r.batch_id, r]));
  document.getElementById("top5").innerHTML = DATA.top_five.map(id => {
    const r = byId[id];
    return `<li><strong>${esc(id)}</strong> ${esc(r.description)}, score ${fmt(r.score)}, ${esc(r.action)} <span class="pill ${r.status}">${r.status}</span></li>`;
  }).join("");
}

function renderControls() {
  const opts = ["ALL", "READY", "HOLD", "MONITOR"];
  document.getElementById("controls").innerHTML =
    opts.map(o => `<button data-f="${o}" class="${o === filter ? "on" : ""}">${o === "ALL" ? "All" : o[0] + o.slice(1).toLowerCase()}</button>`).join("") +
    `<input id="q" placeholder="Search batch, item, action" value="${esc(query)}">`;
  document.querySelectorAll("#controls button").forEach(b => b.onclick = () => { filter = b.dataset.f; renderControls(); renderRows(); });
  const q = document.getElementById("q");
  q.oninput = () => { query = q.value; renderRows(); };
  q.onkeydown = e => e.stopPropagation();
}

function renderHead() {
  document.getElementById("head").innerHTML = COLUMNS.map(c => {
    const active = sortKey === c.key;
    const arrow = active ? (sortDir === 1 ? "▲" : "▼") : "↕";
    return `<th class="sortable${active ? " sorted" : ""}" data-k="${c.key}">${esc(c.label)} <span class="arrow">${arrow}</span></th>`;
  }).join("");
  document.querySelectorAll("#head th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    sortDir = (sortKey === k) ? -sortDir : (COLUMNS.find(c => c.key === k).num ? -1 : 1);
    sortKey = k;
    renderHead(); renderRows();
  });
}

function sortRows(rows) {
  if (!sortKey) return rows;
  const col = COLUMNS.find(c => c.key === sortKey);
  const val = r => col.get ? col.get(r) : r[col.key];
  return [...rows].sort((a, b) => {
    const av = val(a), bv = val(b);
    if (av == null) return 1;
    if (bv == null) return -1;
    const cmp = col.num ? av - bv : String(av).localeCompare(String(bv));
    return cmp * sortDir;
  });
}

function renderRows() {
  const needle = query.trim().toLowerCase();
  let rows = DATA.rows.filter(r =>
    (filter === "ALL" || r.status === filter) &&
    (!needle || [r.batch_id, r.description, r.action, r.approvers.join(" ")].join(" ").toLowerCase().includes(needle)));
  rows = sortRows(rows);
  document.getElementById("rows").innerHTML = rows.map(r => `
    <tr>
      <td><strong>${esc(r.batch_id)}</strong><div class="muted">${esc(r.location_id)}</div></td>
      <td>${esc(r.description)}<div class="muted">${esc(r.product_class)}${r.trust_flag !== "OK" ? ` <span class="star">${esc(r.trust_flag)}</span>` : ""}</div></td>
      <td class="num">${r.days_to_expiry == null ? "n/a" : r.days_to_expiry}</td>
      <td class="num">${money(r.batch_value)}</td>
      <td class="num">${r.score == null ? "n/a" : fmt(r.score)}${r.band ? `<div class="muted">${esc(r.band)}</div>` : ""}</td>
      <td>${esc(r.action)}<div class="cl">${esc(r.clauses.join(", "))}</div></td>
      <td><span class="pill ${r.status}">${r.status}</span>${r.reason ? `<div class="reason">${esc(r.reason)}</div>` : ""}</td>
      <td>${r.approvers.length ? esc(r.approvers.join("; ")) : '<span class="muted">none</span>'}</td>
    </tr>`).join("") || `<tr><td colspan="8" class="muted">No batches match.</td></tr>`;
}

renderCards(); renderRoi(); renderTop5(); renderControls(); renderHead(); renderRows();

if (LIVE) {
  const $ = id => document.getElementById(id);
  const call = (path, body) => fetch(path, body === undefined ? {headers: {"X-Requested-With": "shelflife"}} : {
    method: "POST", headers: {"Content-Type": "application/json", "X-Requested-With": "shelflife"}, body: JSON.stringify(body)
  }).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; });
  let shown = 0, timer = null;

  async function refresh() {
    DATA = await call("/data.json");
    renderCards(); renderRoi(); renderTop5(); renderRows();
  }

  function item(r) {
    if (!r.ok) return `<div class="live-item"><strong>${esc(r.batch_id)}</strong> <span class="live-err">${esc(r.error)}</span></div>`;
    const x = r.row;
    return `<div class="live-item"><strong>${esc(r.batch_id)}</strong> ${esc(x.action || "None")} <span class="pill ${x.status}">${x.status}</span>
      <div class="cl">${esc(x.clause_ids.split(";").join(", "))}${x.approver ? " | approver: " + esc(x.approver) : " | no approver"}</div>
      ${x.hold_reason ? `<div class="reason">${esc(x.hold_reason)}</div>` : ""}
      ${r.reason ? `<div class="reason">Model reason: ${esc(r.reason)}</div>` : ""}
      ${r.ruled_out ? `<div class="reason">Ruled out: ${esc(r.ruled_out.split(";").join(", "))}</div>` : ""}
      ${r.notes ? `<div class="reason live-err">Flags: ${esc(r.notes)}</div>` : ""}
      ${r.request ? `<pre>${esc(r.request)}</pre>` : ""}</div>`;
  }

  async function poll() {
    try {
      const s = await call("/status");
      const out = $("live-out");
      s.results.slice(shown).forEach(r => { out.insertAdjacentHTML("afterbegin", item(r)); });
      shown = s.results.length;
      $("live-msg").textContent = s.running ? `Running: ${s.results.length} of ${s.total} done...` : (s.total ? `Finished ${s.results.length} of ${s.total}.` : "");
      if (!s.running) { clearInterval(timer); timer = null; $("live-run").disabled = !s.key_set; await refresh(); }
    } catch (e) { $("live-msg").textContent = e.message; clearInterval(timer); timer = null; $("live-run").disabled = false; }
  }

  async function init() {
    $("live").hidden = false;
    const s = await call("/status");
    $("live-note").textContent = `Runs tools/run_agent.py on this computer. Each batch is up to two paid API calls. Up to ${s.max_batches} batches per run. Results are saved to action_queue_api.csv and the table below updates when the run ends.`;
    if (!s.key_set) { $("live-run").disabled = true; $("live-msg").textContent = "ANTHROPIC_API_KEY is not set in the environment of the server. Stop it, set the key, and start it again."; }
    $("live-run").onclick = async () => {
      const ids = $("live-ids").value.split(/[\s,;]+/).filter(Boolean);
      if (!ids.length) { $("live-msg").textContent = "Enter at least one batch ID."; return; }
      $("live-run").disabled = true; $("live-out").innerHTML = ""; shown = 0;
      try { await call("/run", {batches: ids}); $("live-msg").textContent = "Started..."; timer = setInterval(poll, 1500); poll(); }
      catch (e) { $("live-msg").textContent = e.message; $("live-run").disabled = false; }
    };
    $("live-ids").onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") $("live-run").click(); };
    if (s.running) { $("live-run").disabled = true; timer = setInterval(poll, 1500); poll(); }
  }
  init();
}
</script>
</body>
</html>
